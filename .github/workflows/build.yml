name: Build EcoLab

on:
  push:
    branches: ["main"]
  workflow_dispatch:  # permite rodar manualmente

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            spec: EcoLab.spec
            artifact: EcoLab-Windows
            exe: dist/EcoLab.exe

          - os: ubuntu-latest
            name: Linux
            spec: EcoLab-Linux.spec
            artifact: EcoLab-Linux
            exe: dist/EcoLab

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev \
            gdal-bin \
            libgeos-dev \
            libproj-dev \
            libspatialindex-dev \
            python3-dev \
            build-essential

      - name: Build frontend
        run: |
          cd ecoLab/frontend
          npm install
          npm run build
        env:
          CI: false

      - name: Create required directories
        run: mkdir -p ecoLab/maps
        
      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: | 
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
          pip install pyinstaller
          pyinstaller EcoLab.spec

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
          pip install pyinstaller
          pyinstaller EcoLab-Linux.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.exe }}
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: EcoLab-Windows
          path: artifacts/windows

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: EcoLab-Linux
          path: artifacts/linux

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Build"
          prerelease: true
          files: |
            artifacts/windows/EcoLab_windows.exe
            artifacts/linux/EcoLab_linux
          generate_release_notes: true    