name: Build EcoLab

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  # ── Windows: PyInstaller + Inno Setup ──────────────────────────────────────
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        run: |
          cd ecoLab/frontend
          npm install
          npm run build
        env:
          CI: false

      - name: Create required directories
        run: mkdir -p ecoLab/maps

      - name: Build executable (PyInstaller)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
          pip install pyinstaller
          pyinstaller EcoLab.spec

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "${{ github.workspace }}\EcoLab_Installer.iss"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: EcoLab-Windows-Installer
          path: installer_output/EcoLab_Setup_v0.1.1.exe
          retention-days: 30

  # ── Linux: PyInstaller + pacote .deb ───────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev gdal-bin \
            libgeos-dev libproj-dev \
            libspatialindex-dev \
            python3-dev build-essential

      - name: Build frontend
        run: |
          cd ecoLab/frontend
          npm install
          npm run build
        env:
          CI: false

      - name: Create required directories
        run: mkdir -p ecoLab/maps

      - name: Build executable (PyInstaller)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
          pip install pyinstaller
          pyinstaller EcoLab-Linux.spec

      - name: Package .deb
        run: |
          PKG=ecolab_0.1.1_amd64
          mkdir -p $PKG/DEBIAN
          mkdir -p $PKG/opt/ecolab
          mkdir -p $PKG/usr/share/applications
          mkdir -p $PKG/usr/share/icons/hicolor/256x256/apps

          cp dist/EcoLab $PKG/opt/ecolab/EcoLab
          chmod +x $PKG/opt/ecolab/EcoLab

          if [ -f EcoLab.png ]; then
            cp EcoLab.png $PKG/usr/share/icons/hicolor/256x256/apps/ecolab.png
          fi

          cat > $PKG/DEBIAN/control << 'EOF'
          Package: ecolab
          Version: 0.1.1
          Section: science
          Priority: optional
          Architecture: amd64
          Maintainer: UTFPR
          Description: EcoLab - Ecological Analysis Tool
          EOF

          cat > $PKG/usr/share/applications/ecolab.desktop << 'EOF'
          [Desktop Entry]
          Name=EcoLab
          Exec=/opt/ecolab/EcoLab
          Icon=ecolab
          Type=Application
          Categories=Science;Education;
          Terminal=false
          EOF

          dpkg-deb --build $PKG EcoLab-Linux.deb

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: EcoLab-Linux-Installer
          path: EcoLab-Linux.deb
          retention-days: 30

  # ── macOS: PyInstaller + .dmg ──────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install system dependencies (Homebrew)
        run: |
          brew install gdal geos proj spatialindex

      - name: Build frontend
        run: |
          cd ecoLab/frontend
          npm install
          npm run build
        env:
          CI: false

      - name: Create required directories
        run: mkdir -p ecoLab/maps

      - name: Build executable (PyInstaller)
        run: |
          python -m pip install --upgrade pip
          pip install setuptools
          pip install -r requirements-build.txt
          pip install pyinstaller
          pyinstaller EcoLab-macOS.spec

      - name: Package .dmg
        run: |
          brew install create-dmg

          APP_PATH="dist/EcoLab.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Erro: $APP_PATH não encontrado após o build."
            exit 1
          fi

          # Se tiver EcoLab.icns no repositório, adicione: --volicon "EcoLab.icns"
          create-dmg \
            --volname "EcoLab" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "EcoLab.app" 175 190 \
            --hide-extension "EcoLab.app" \
            --app-drop-link 425 190 \
            "EcoLab-macOS.dmg" \
            "dist/"

          ls -lh EcoLab-macOS.dmg || (echo "Erro: DMG não foi gerado" && exit 1)

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: EcoLab-macOS-Installer
          path: EcoLab-macOS.dmg
          retention-days: 30

  # ── Smoke test Linux ──────────────────────────────────────────────────────
  test-linux:
    needs: build-linux
    runs-on: ubuntu-latest

    steps:
      - name: Download .deb
        uses: actions/download-artifact@v4
        with:
          name: EcoLab-Linux-Installer
          path: artifacts/linux

      - name: Install .deb
        run: sudo dpkg -i artifacts/linux/EcoLab-Linux.deb

      - name: Start EcoLab in background
        run: |
          /opt/ecolab/EcoLab > /tmp/ecolab.log 2>&1 &
          echo $! > /tmp/ecolab.pid
          sleep 20
          echo "=== LOG DO ECOLAB ==="
          cat /tmp/ecolab.log
          echo "=== PORTAS ABERTAS ==="
          ss -tlnp

      - name: Wait for backend to be ready
        run: |
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8001/)
            if [ "$STATUS" = "200" ]; then
              echo "Backend respondeu OK (HTTP $STATUS)"
              exit 0
            fi
            echo "Tentativa $i — status $STATUS, aguardando..."
            sleep 2
          done
          echo "Timeout: backend não respondeu em 60s"
          exit 1

      - name: Stop EcoLab
        if: always()
        run: kill $(cat /tmp/ecolab.pid) 2>/dev/null || true

  # ── Smoke test macOS ──────────────────────────────────────────────────────
  test-macos:
    needs: build-macos
    runs-on: macos-latest

    steps:
      - name: Download .dmg
        uses: actions/download-artifact@v4
        with:
          name: EcoLab-macOS-Installer
          path: artifacts/macos

      - name: Mount .dmg and install app
        run: |
          hdiutil attach artifacts/macos/EcoLab-macOS.dmg -mountpoint /Volumes/EcoLab -nobrowse -quiet
          cp -R /Volumes/EcoLab/EcoLab.app /Applications/EcoLab.app
          hdiutil detach /Volumes/EcoLab -quiet

      - name: Start EcoLab in background
        run: |
          /Applications/EcoLab.app/Contents/MacOS/EcoLab > /tmp/ecolab.log 2>&1 &
          echo $! > /tmp/ecolab.pid
          sleep 20
          echo "=== LOG DO ECOLAB ==="
          cat /tmp/ecolab.log
          echo "=== PORTAS ABERTAS ==="
          netstat -an | grep LISTEN

      - name: Wait for backend to be ready
        run: |
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8001/)
            if [ "$STATUS" = "200" ]; then
              echo "Backend respondeu OK (HTTP $STATUS)"
              exit 0
            fi
            echo "Tentativa $i — status $STATUS, aguardando..."
            sleep 2
          done
          echo "Timeout: backend não respondeu em 60s"
          exit 1

      - name: Stop EcoLab
        if: always()
        run: kill $(cat /tmp/ecolab.pid) 2>/dev/null || true

  # ── Release: publica todos os instaladores ────────────────────────────────
  release:
    needs: [build-windows, test-linux, test-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: EcoLab-Windows-Installer
          path: artifacts/windows

      - name: Download Linux installer
        uses: actions/download-artifact@v4
        with:
          name: EcoLab-Linux-Installer
          path: artifacts/linux

      - name: Download macOS installer
        uses: actions/download-artifact@v4
        with:
          name: EcoLab-macOS-Installer
          path: artifacts/macos

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Build"
          prerelease: true
          files: |
            artifacts/windows/EcoLab_Setup_v0.1.1.exe
            artifacts/linux/EcoLab-Linux.deb
            artifacts/macos/EcoLab-macOS.dmg
          generate_release_notes: true