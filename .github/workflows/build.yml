name: Build EcoLab

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  # ── Windows: PyInstaller + Inno Setup ──────────────────────────────────────
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        run: |
          cd ecoLab/frontend
          npm install
          npm run build
        env:
          CI: false

      - name: Create required directories
        run: mkdir -p ecoLab/maps

      - name: Build executable (PyInstaller)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
          pip install pyinstaller
          pyinstaller EcoLab.spec

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc /O"installer_output" /DAppVersion=0.1.1 "${{ github.workspace }}\EcoLab_Installer.iss"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: EcoLab-Windows-Installer
          path: installer_output/*.exe
          retention-days: 30

  # ── Linux: PyInstaller + pacote .deb ───────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev gdal-bin \
            libgeos-dev libproj-dev \
            libspatialindex-dev \
            python3-dev build-essential

      - name: Build frontend
        run: |
          cd ecoLab/frontend
          npm install
          npm run build
        env:
          CI: false

      - name: Create required directories
        run: mkdir -p ecoLab/maps

      - name: Build executable (PyInstaller)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
          pip install pyinstaller
          pyinstaller EcoLab-Linux.spec

      - name: Package .deb
        run: |
          PKG=ecolab_0.1.1_amd64
          mkdir -p $PKG/DEBIAN
          mkdir -p $PKG/opt/ecolab
          mkdir -p $PKG/usr/share/applications
          mkdir -p $PKG/usr/share/icons/hicolor/256x256/apps

          cp dist/EcoLab $PKG/opt/ecolab/EcoLab
          chmod +x $PKG/opt/ecolab/EcoLab

          if [ -f EcoLab.png ]; then
            cp EcoLab.png $PKG/usr/share/icons/hicolor/256x256/apps/ecolab.png
          fi

          cat > $PKG/DEBIAN/control << 'EOF'
          Package: ecolab
          Version: 0.1.1
          Section: science
          Priority: optional
          Architecture: amd64
          Maintainer: UTFPR
          Description: EcoLab - Ecological Analysis Tool
          EOF

                    cat > $PKG/usr/share/applications/ecolab.desktop << 'EOF'
          [Desktop Entry]
          Name=EcoLab
          Exec=/opt/ecolab/EcoLab
          Icon=ecolab
          Type=Application
          Categories=Science;Education;
          Terminal=false
          EOF

                    dpkg-deb --build $PKG EcoLab-Linux.deb

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: EcoLab-Linux-Installer
          path: EcoLab-Linux.deb
          retention-days: 30

  # ── Release: publica ambos os instaladores ─────────────────────────────────
  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: EcoLab-Windows-Installer
          path: artifacts/windows

      - name: Download Linux installer
        uses: actions/download-artifact@v4
        with:
          name: EcoLab-Linux-Installer
          path: artifacts/linux

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Build"
          prerelease: true
          files: |
            artifacts/windows/EcoLab_Setup_v0.1.1.exe
            artifacts/linux/EcoLab-Linux.deb
          generate_release_notes: true