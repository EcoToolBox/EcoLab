name: Build EcoLab

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  build-windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
      - uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm
          cache-dependency-path: ecoLab/frontend/package-lock.json
      - name: Build frontend
        working-directory: ecoLab/frontend
        run: npm ci && npm run build
        env:
          CI: "false"
      - name: Prepare build directories
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path ecoLab/maps | Out-Null
      - name: Build executable
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt pyinstaller
          python -m PyInstaller build/EcoLab.spec
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" EcoLab_Installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: EcoLab-Windows-Installer
          path: installer_output/EcoLab_Setup.exe
          if-no-files-found: error

  build-linux:
    name: Linux package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
      - uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm
          cache-dependency-path: ecoLab/frontend/package-lock.json
      - name: Install geospatial libraries
        run: sudo apt-get update && sudo apt-get install -y libgdal-dev gdal-bin libgeos-dev libproj-dev libspatialindex-dev
      - name: Build frontend
        working-directory: ecoLab/frontend
        run: npm ci && npm run build
        env:
          CI: "false"
      - name: Build executable
        run: |
          mkdir -p ecoLab/maps
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt pyinstaller
          python -m PyInstaller build/EcoLab-Linux.spec
      - name: Package .deb
        run: |
          pkg=ecolab_0.1.1_amd64
          mkdir -p "$pkg/DEBIAN" "$pkg/opt/ecolab" "$pkg/usr/share/applications" "$pkg/usr/share/icons/hicolor/256x256/apps"
          cp dist/EcoLab "$pkg/opt/ecolab/EcoLab"
          chmod +x "$pkg/opt/ecolab/EcoLab"
          cp ecoLab/frontend/src/assets/EcoLab.png "$pkg/usr/share/icons/hicolor/256x256/apps/ecolab.png"
          printf 'Package: ecolab\nVersion: 0.1.1\nSection: science\nPriority: optional\nArchitecture: amd64\nMaintainer: UTFPR\nDescription: EcoLab - Ecological Analysis Tool\n' > "$pkg/DEBIAN/control"
          printf '[Desktop Entry]\nName=EcoLab\nExec=/opt/ecolab/EcoLab\nIcon=ecolab\nType=Application\nCategories=Science;Education;\nTerminal=false\n' > "$pkg/usr/share/applications/ecolab.desktop"
          dpkg-deb --build "$pkg" EcoLab-Linux.deb
      - uses: actions/upload-artifact@v4
        with:
          name: EcoLab-Linux-Installer
          path: EcoLab-Linux.deb
          if-no-files-found: error

  build-macos:
    name: macOS (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            name: Intel
            slug: intel
          - runner: macos-14
            name: Apple Silicon
            slug: apple-silicon
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
      - uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm
          cache-dependency-path: ecoLab/frontend/package-lock.json
      - name: Install geospatial libraries
        run: brew install gdal geos proj spatialindex create-dmg
      - name: Build frontend
        working-directory: ecoLab/frontend
        run: npm ci && npm run build
        env:
          CI: "false"
      - name: Build app bundle
        run: |
          mkdir -p ecoLab/maps
          python -m pip install --upgrade pip setuptools
          pip install -r requirements-build.txt pyinstaller
          # pkg_resources é removido pelo setuptools recente; neutralizamos o
          # runtime hook legado do PyInstaller apenas neste ambiente de build.
          python -c "import os, PyInstaller; open(os.path.join(os.path.dirname(PyInstaller.__file__), 'hooks', 'rthooks', 'pyi_rth_pkgres.py'), 'w').write('# disabled by EcoLab macOS build\n')"
          python -m PyInstaller build/EcoLab-macOS.spec
          test -d dist/EcoLab.app
      - name: Package DMG
        run: |
          create-dmg --volname "EcoLab" --window-pos 200 120 --window-size 600 400 --icon-size 100 --icon "EcoLab.app" 175 190 --hide-extension "EcoLab.app" --app-drop-link 425 190 "EcoLab-macOS-${{ matrix.slug }}.dmg" dist/
      - uses: actions/upload-artifact@v4
        with:
          name: EcoLab-macOS-${{ matrix.slug }}-Installer
          path: EcoLab-macOS-${{ matrix.slug }}.dmg
          if-no-files-found: error

  test-linux:
    name: Linux startup test
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: EcoLab-Linux-Installer
          path: artifact
      - name: Install and start EcoLab
        run: |
          sudo dpkg -i artifact/EcoLab-Linux.deb
          ECOLAB_OPEN_BROWSER=0 /opt/ecolab/EcoLab > /tmp/ecolab.log 2>&1 &
          echo $! > /tmp/ecolab.pid
          trap 'kill $(cat /tmp/ecolab.pid) 2>/dev/null || true; cat /tmp/ecolab.log || true' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8000/api/config && exit 0
            sleep 2
          done
          exit 1

  test-macos:
    name: macOS startup test (${{ matrix.name }})
    needs: build-macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            name: Intel
            slug: intel
          - runner: macos-14
            name: Apple Silicon
            slug: apple-silicon
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: "EcoLab-macOS-${{ matrix.slug }}-Installer"
          path: artifact
      - name: Mount and start EcoLab
        run: |
          hdiutil attach "artifact/EcoLab-macOS-${{ matrix.slug }}.dmg" -mountpoint /Volumes/EcoLab -nobrowse -quiet
          ECOLAB_OPEN_BROWSER=0 /Volumes/EcoLab/EcoLab.app/Contents/MacOS/EcoLab > /tmp/ecolab.log 2>&1 &
          echo $! > /tmp/ecolab.pid
          trap 'kill $(cat /tmp/ecolab.pid) 2>/dev/null || true; hdiutil detach /Volumes/EcoLab -quiet || true; cat /tmp/ecolab.log || true' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8000/api/config && exit 0
            sleep 2
          done
          exit 1

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-windows, build-linux, build-macos, test-linux, test-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: EcoLab-Windows-Installer
          path: artifacts/windows
      - uses: actions/download-artifact@v4
        with:
          name: EcoLab-Linux-Installer
          path: artifacts/linux
      - uses: actions/download-artifact@v4
        with:
          pattern: EcoLab-macOS-*-Installer
          path: artifacts/macos
          merge-multiple: true
      - name: Create prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          prerelease: true
          generate_release_notes: true
          files: |
            artifacts/windows/EcoLab_Setup.exe
            artifacts/linux/EcoLab-Linux.deb
            artifacts/macos/*.dmg
