# ─────────────────────────────────────────────────────────────────────────────
#  EcoLab · Build & Release
#
#  • PR ou push na main  → compila e testa os 3 instaladores
#  • push na main        → atualiza o pré-release "nightly" (versão de teste)
#  • tag vX.Y.Z          → publica a release oficial (python scripts/release.py X.Y.Z)
#  • Mudou só .md/docs   → nem roda
# ─────────────────────────────────────────────────────────────────────────────
name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths-ignore: ["**.md", "docs/**", "CITATION.cff", ".vscode/**", ".idea/**"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "CITATION.cff", ".vscode/**", ".idea/**"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # ── 1. Descobre a versão (fonte única: arquivo VERSION) ───────────────────
  version:
    name: Versão
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      numeric: ${{ steps.v.outputs.numeric }}
      channel: ${{ steps.v.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - name: Checa sintaxe do backend (falha em segundos, não depois do build)
        run: python3 -m compileall -q ecoLab/backend scripts/run_exe.py
      - id: v
        run: |
          base="$(tr -d '[:space:]' < VERSION)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/v}"
            if [[ "$tag" != "$base" ]]; then
              echo "::error::A tag v$tag não bate com o arquivo VERSION ($base). Use: python scripts/release.py $tag"
              exit 1
            fi
            version="$base"; channel="stable"
          else
            version="$base-dev.$GITHUB_RUN_NUMBER"; channel="nightly"
          fi
          {
            echo "version=$version"
            echo "numeric=$base"
            echo "channel=$channel"
          } >> "$GITHUB_OUTPUT"
          echo "### 🌿 EcoLab \`$version\` ($channel)" >> "$GITHUB_STEP_SUMMARY"

  # ── 2. Frontend: compila uma vez, os 3 SOs reaproveitam ───────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ecoLab/frontend/package-lock.json
      - name: npm ci + build
        working-directory: ecoLab/frontend
        env:
          CI: "false"
          GENERATE_SOURCEMAP: "false"
        run: npm ci --no-audit --no-fund && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ecoLab/frontend/build
          if-no-files-found: error
          retention-days: 1

  # ── 3. Windows ────────────────────────────────────────────────────────────
  windows:
    name: Windows
    needs: [version, frontend]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: frontend-build, path: ecoLab/frontend/build }
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: PyInstaller
        run: |
          mkdir -p ecoLab/maps
          pip install -r requirements-build.txt pyinstaller
          python -m PyInstaller --noconfirm build/EcoLab.spec
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q `
            "/DAppVersion=${{ needs.version.outputs.version }}" `
            "/DAppVersionNumeric=${{ needs.version.outputs.numeric }}" `
            EcoLab_Installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Teste — instala em silêncio
        shell: pwsh
        run: |
          $p = Start-Process installer_output\EcoLab-Windows-Setup.exe -Wait -PassThru `
            -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/CURRENTUSER','/NORESTART','/DIR=C:\EcoLabTest'
          if ($p.ExitCode -ne 0) { Write-Error "Instalador saiu com código $($p.ExitCode)"; exit 1 }
          if (-not (Test-Path C:\EcoLabTest\EcoLab.exe)) { Write-Error "EcoLab.exe não foi instalado"; exit 1 }
      - name: Teste — abre o app
        run: bash scripts/ci/smoke-test.sh /c/EcoLabTest/EcoLab.exe
      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: installer_output/EcoLab-Windows-Setup.exe
          if-no-files-found: error

  # ── 4. Linux ──────────────────────────────────────────────────────────────
  linux:
    name: Linux
    needs: [version, frontend]
    runs-on: ubuntu-22.04   # glibc mais antiga = roda em mais distros
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: frontend-build, path: ecoLab/frontend/build }
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Bibliotecas geoespaciais
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgdal-dev gdal-bin libgeos-dev libproj-dev libspatialindex-dev
      - name: PyInstaller
        run: |
          mkdir -p ecoLab/maps
          pip install -r requirements-build.txt pyinstaller
          python -m PyInstaller --noconfirm build/EcoLab-Linux.spec
      - name: Pacote .deb
        run: bash installer/linux/build-deb.sh "${{ needs.version.outputs.version }}"
      - name: Teste — instala e abre
        run: |
          sudo apt-get install -y -qq ./EcoLab-Linux-amd64.deb
          bash scripts/ci/smoke-test.sh /opt/ecolab/EcoLab
      - uses: actions/upload-artifact@v4
        with:
          name: installer-linux
          path: EcoLab-Linux-amd64.deb
          if-no-files-found: error

  # ── 5. macOS (Apple Silicon) ──────────────────────────────────────────────
  macos:
    name: macOS
    needs: [version, frontend]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: frontend-build, path: ecoLab/frontend/build }
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Bibliotecas geoespaciais
        env: { HOMEBREW_NO_AUTO_UPDATE: "1", HOMEBREW_NO_INSTALL_CLEANUP: "1" }
        run: brew install gdal geos proj spatialindex create-dmg
      - name: Ícone
        run: bash installer/macos/build-dmg.sh icon
      - name: PyInstaller
        env:
          ECOLAB_VERSION_NUMERIC: ${{ needs.version.outputs.numeric }}
        run: |
          mkdir -p ecoLab/maps
          pip install --upgrade setuptools
          pip install -r requirements-build.txt pyinstaller
          # setuptools novo removeu pkg_resources; neutraliza o runtime hook legado do PyInstaller
          python -c "import os, PyInstaller; open(os.path.join(os.path.dirname(PyInstaller.__file__), 'hooks', 'rthooks', 'pyi_rth_pkgres.py'), 'w').write('# disabled by EcoLab macOS build\n')"
          python -m PyInstaller --noconfirm build/EcoLab-macOS.spec
      - name: DMG
        run: bash installer/macos/build-dmg.sh dmg EcoLab-macOS-AppleSilicon.dmg
      - name: Teste — monta e abre
        run: |
          hdiutil attach EcoLab-macOS-AppleSilicon.dmg -mountpoint /Volumes/EcoLab -nobrowse -quiet
          bash scripts/ci/smoke-test.sh /Volumes/EcoLab/EcoLab.app/Contents/MacOS/EcoLab
          hdiutil detach /Volumes/EcoLab -quiet || true
      - uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: EcoLab-macOS-AppleSilicon.dmg
          if-no-files-found: error

  # ── 6. Publica no GitHub Releases ─────────────────────────────────────────
  release:
    name: Publicar
    if: github.event_name == 'push'
    needs: [version, windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      CHANNEL: ${{ needs.version.outputs.channel }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum EcoLab-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Nightly (pré-release de teste)
        if: env.CHANNEL == 'nightly'
        run: |
          # recria do zero para a tag apontar para o commit atual
          gh release delete nightly --cleanup-tag --yes 2>/dev/null || true
          gh release delete latest  --cleanup-tag --yes 2>/dev/null || true   # nome antigo, só limpeza
          gh release create nightly dist/* \
            --target "$GITHUB_SHA" --prerelease \
            --title "🌙 Nightly $VERSION" \
            --notes "Versão de teste gerada automaticamente a partir da \`main\` (commit ${GITHUB_SHA::7}). Pode conter bugs, para uso geral prefira a [última versão estável](https://github.com/$GH_REPO/releases/latest)."

      - name: Release oficial
        if: env.CHANNEL == 'stable'
        run: |
          gh release create "v$VERSION" dist/* \
            --verify-tag --latest --generate-notes \
            --title "EcoLab $VERSION"

      - name: Resumo
        run: |
          tag=$([ "$CHANNEL" = stable ] && echo "v$VERSION" || echo nightly)
          base="https://github.com/$GH_REPO/releases/download/$tag"
          {
            echo "### 📦 Instaladores publicados ($tag)"
            echo "| Sistema | Download |"
            echo "|---|---|"
            echo "| 🪟 Windows | [EcoLab-Windows-Setup.exe]($base/EcoLab-Windows-Setup.exe) |"
            echo "| 🐧 Linux (.deb) | [EcoLab-Linux-amd64.deb]($base/EcoLab-Linux-amd64.deb) |"
            echo "| 🍎 macOS (M1/M2/M3) | [EcoLab-macOS-AppleSilicon.dmg]($base/EcoLab-macOS-AppleSilicon.dmg) |"
          } >> "$GITHUB_STEP_SUMMARY"
